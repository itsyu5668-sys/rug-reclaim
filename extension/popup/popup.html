<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">RUG RECLAIM</div>
    <div class="tagline">dead accounts → your SOL back</div>
  </header>

  <section id="setup">
    <label for="addr">Wallet address <span class="hint">(read-only scan — no connection needed)</span></label>
    <div class="row">
      <input id="addr" type="text" placeholder="paste a Solana address" autocomplete="off" spellcheck="false" />
      <button id="scanBtn" class="primary">Scan</button>
    </div>
    <div id="addrError" class="error hidden"></div>
  </section>

  <section id="loading" class="hidden">
    <div class="spinner"></div>
    <div>scanning token accounts…</div>
  </section>

  <section id="results" class="hidden">
    <div class="bignum"><span id="totalSol">0</span><span class="unit">SOL</span></div>
    <div class="sub">trapped across <span id="acctCount">0</span> accounts</div>

    <div class="breakdown">
      <div class="line"><span>dead accounts</span><b id="deadSol">0 SOL</b></div>
      <div class="line"><span>excess rent on live accounts</span><b id="surplusSol">0 SOL</b></div>
    </div>

    <div id="feePreview" class="feeline hidden"></div>

    <div id="refRow" class="hidden">
      <label for="referrer" class="hint">referred by a friend? paste their wallet (optional)</label>
      <input id="referrer" type="text" placeholder="referrer's Solana address" autocomplete="off" spellcheck="false" />
    </div>

    <button id="reclaimBtn" class="primary big" disabled>Reclaim</button>
    <div id="progress" class="meta hidden"></div>
    <div id="scannedAt" class="meta"></div>
  </section>

  <footer>
    <span><span class="lock">◈</span> non-custodial · open source · you approve every transaction</span>
  </footer>

<script src="popup.bundle.js"></script>
</body>
</html>
